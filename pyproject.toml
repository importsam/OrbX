[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orbx"
version = "1.0.0"
description = "Satellite orbit similarity clustering using HDBSCAN"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
    "hdbscan",
    "sgp4",
    "tqdm",
    "matplotlib",
    "plotly",
    "scikit-learn",
    "dbcv @ git+https://github.com/FelSiq/DBCV",
    "s-dbw",
    "viasckde"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = [
    "integration: tests that need orekit or heavy orbit computations",
    "slow: end-to-end clustering or density runs",
]

[tool.setuptools.packages.find]
where = ["src"]   

[tool.setuptools.package-data]
"orbx" = ["py.typed"] 

